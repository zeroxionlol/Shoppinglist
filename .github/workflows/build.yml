name: Android Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check Gemini AppFunctions metadata
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -i -E "app_function|\.xsd" || echo "WARN: no AppFunction assets found"

      - name: Check ML Kit survived R8
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump 2>/dev/null | tail -1)
          if [ -z "$DEXDUMP" ]; then echo "::warning::dexdump nicht gefunden, Pruefung uebersprungen"; exit 0; fi
          rm -rf /tmp/dex && mkdir /tmp/dex && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          for d in /tmp/dex/*.dex; do "$DEXDUMP" "$d"; done > /tmp/dexdump.txt
          for c in BarcodeRegistrar TextRegistrar VisionCommonRegistrar CommonComponentRegistrar; do
            awk -v c="/$c;" '/^Class #/{inb=0} /Class descriptor/ && index($0, c){inb=1} inb && /name *: .<init>./{f=1} END{exit !f}' /tmp/dexdump.txt \
              || { echo "::error::$c hat in der APK keinen Konstruktor mehr - ML Kit wuerde abstuerzen"; exit 1; }
            echo "$c ok"
          done

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Einkaufsliste-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Einkaufsliste-v1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --title "Einkaufsliste v1.0.${{ github.run_number }}" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}. APK herunterladen und installieren." \
            --latest
